name: One Piece Card Monitor

# Cuándo se va a ejecutar este bot
on:
  schedule:
    - cron: '0 * * * *' # Se ejecuta en el minuto 0 de cada hora
  workflow_dispatch: # ¡Magia! Esto crea un botón para ejecutarlo manualmente cuando quieras

jobs:
  run-bot:
    runs-on: ubuntu-latest # Usamos un servidor Linux gratuito de GitHub

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v3

      - name: Configurar el entorno de Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10' # Una versión estable

      - name: Instalar las librerías
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar el Scraper
        env:
          # Inyectamos los secretos de GitHub como variables de entorno
          CARD_URL: ${{ secrets.CARD_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: python scraper.py
